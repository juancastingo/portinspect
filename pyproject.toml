[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portinspect"
version = "0.1.0"
description = "Lightweight Python library and CLI for inspecting local network listening ports, interfaces, processes, and exposure boundaries"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Juan Castin", email = "juancastingo@users.noreply.github.com" },
]
keywords = [
    "networking",
    "ports",
    "sockets",
    "inspection",
    "security",
    "audit",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
portinspect = "portinspect.cli:main"

[project.urls]
Homepage = "https://github.com/juancastingo/portinspect"
Repository = "https://github.com/juancastingo/portinspect"
Issues = "https://github.com/juancastingo/portinspect/issues"
